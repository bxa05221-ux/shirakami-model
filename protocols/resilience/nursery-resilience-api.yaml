api:
  name: Nursery Resilience API
  id: nursery-resilience-api
  version: "1.0.0-alpha"
  status: experimental

  title: "保育レジリエンス・プロジェクト α1.0"
  slogan: "今日の保育を記録するのではなく、今日の保育から明日の保育をつくる。"

  purpose:
    - 個別保育計画の策定支援
    - 発達経過と保育計画の接続
    - 日々の観察の蓄積
    - チェックポイントの管理
    - ヒヤリハットの管理
    - インシデントの管理
    - 人員配置と保育負荷の観測
    - 職員間のLandscape共有
    - 継続性のある保育計画の策定支援
    - AIによる観測・整理・比較・問い返し
    - スレゼンターによるLandscapeの対話的レンダリング
    - 翌日の保育計画案生成

  scope:
    alpha_1_0:
      core_loop: "今日の保育の観測から翌日の保育計画案まで"
      pilot_facilities: 3
      final_approval: human
    future:
      - 日誌生成
      - ヒヤリハット報告生成
      - 事故報告生成
      - 会議録生成
      - 対応記録生成
      - 対応マニュアル改訂案生成
      - 職員向け共有資料生成

  principles:
    landscape_first: true
    child_worldview_first: true
    observation_before_interpretation: true
    environment_before_correction: true
    continuity_required: true
    multiple_observations_preserved: true
    original_evidence_preserved: true
    ai_is_not_decision_maker: true
    human_approval_required: true
    staff_evaluation_is_separated: true
    diagnosis_is_not_the_purpose: true
    facility_policy_is_adaptive: true

  actors:
    child:
      role: "保育の中心となる主体"
    childcare_teacher:
      role: "観察・保育実践・判断・承認"
    support_staff:
      role: "観察・支援・チーム連携"
    manager:
      role: "組織・人員配置・安全・計画の確認"
    ai_runtime:
      role: "観測の整理・接続・比較・提案・計画案生成"
    presenter:
      role: "Landscapeを職員が読める対話の景色へレンダリング"

  development_basis:
    primary:
      - "遠城寺式発達経過記録表"
    usage:
      - "発達経過を診断・分類のためではなく、現在の姿と保育計画の継続性を支援する基礎情報として扱う。"

  data_layers:
    landscape:
      description: "子ども・人・物・空間・時間・遊び・関係・経験等の現在の景色"
    evidence:
      description: "観察・記録・安全事象・計画変更等、後から追跡可能な事実・記録"
    protocol:
      description: "観測から計画更新までの境界・手順・ルール"
    runtime:
      description: "Protocolを実行し、LandscapeとEvidenceを接続する機構"
    artifact:
      description: "日誌・保育計画・報告・会議録・マニュアル改訂案等の生成物"

  resources:
    children:
      operations: [create, read, update]
    development_records:
      operations: [create, read, update, compare]
    observations:
      operations: [create, read, search, relate]
    landscapes:
      operations: [snapshot, compare, observe, trace]
    childcare_plans:
      operations: [draft, review, approve, revise, compare, continue]
    developmental_support:
      levels:
        0: observation
        1: environmental_adjustment
        2: individual_participation_route
        3: team_review
        4: external_support_consideration
      operations: [assess, suggest, review]
      constraint: "診断を行わず、保育環境・参加方法・観察継続を中心に支援案を扱う。"
    safety:
      types: [checkpoint, hiyari_hat, incident]
      operations: [record, analyze, review, prevent_recurrence]
    staffing:
      operations: [record, plan, simulate, assess_load]
    environment:
      operations: [observe, adjust, compare]
    activities:
      operations: [create, update, evaluate]
    documents:
      types:
        - daily_log
        - childcare_plan
        - hiyari_hat_report
        - incident_report
        - meeting_minutes
        - response_record
        - manual_revision
        - staff_shared_material
      operations: [draft, review, approve, revise]
    feedback:
      operations:
        - summarize
        - detect_change
        - detect_pattern
        - detect_conflict
        - suggest_questions
        - suggest_revision
    shared_landscape:
      operations: [aggregate, compare, trace, feedback]

  workflows:
    daily_observation:
      process:
        - record
        - preserve_original
        - relate_to_landscape
        - relate_to_previous_observations
        - detect_change
        - expose_uncertainty

    individual_plan:
      process:
        - observe
        - identify_current_state
        - identify_developmental_context
        - formulate_hypothesis
        - propose_environment
        - propose_support
        - define_checkpoints
        - draft_plan
        - human_review
        - approve

    developmental_support:
      process:
        - identify_context
        - formulate_hypothesis
        - propose_environmental_adjustment
        - trial
        - re_observe
        - review

    safety_loop:
      process:
        - record
        - classify
        - preserve_evidence
        - identify_environmental_factors
        - identify_staffing_factors
        - propose_prevention
        - human_review
        - update_plan

    staffing_loop:
      process:
        - assess_required_attention
        - assess_available_capacity
        - detect_load_concentration
        - propose_adjustment
        - human_decision

    presenter_loop:
      description: "複数の職員観察と関連Evidenceを、一つの結論に潰さず対話可能なThreadとして提示する。"
      process:
        - collect_relevant_observations
        - preserve_observer_context
        - order_by_time_or_relation
        - surface_agreements
        - surface_differences
        - surface_missing_information
        - formulate_questions
        - render_thread
        - invite_human_dialogue
      constraints:
        - "スレゼンターはAI人格・ロボット・最終判断者ではない。"
        - "観察者の発言を勝手に同一化しない。"
        - "事実と解釈を区別して表示する。"
        - "不確実性を残す。"
        - "職員の対話と判断を置き換えない。"

    next_day_plan:
      description: "今日のLandscapeから翌日の保育計画案を生成する。"
      process:
        - integrate_observations
        - compare_development
        - compare_previous_plan
        - integrate_environment
        - integrate_safety
        - integrate_staffing
        - identify_continuity
        - identify_change
        - identify_next_observation
        - propose_environmental_adjustment
        - propose_childcare_support
        - define_checkpoints
        - draft_next_day_plan
        - presenter_review
        - human_review
        - human_approval
        - execute_next_day_plan
        - observe_result

  observation_model:
    minimum_fields:
      - timestamp
      - observer
      - child_or_group
      - context
      - observed_fact
      - optional_interpretation
      - optional_question
    rule: "観察事実と解釈を可能な限り分離する。"

  plan_model:
    next_day_plan:
      required:
        - observation_focus
        - environmental_adjustment
        - childcare_support
        - checkpoints
      optional:
        - staffing
        - activity_design
        - reflection
      approval:
        required: true
        actor: human

  ai_policy:
    role:
      - observation
      - organization
      - connection
      - comparison
      - pattern_detection
      - question_generation
      - planning_assistance
      - artifact_drafting
    prohibited_as_final_decision:
      - diagnosis
      - child_labeling
      - staff_evaluation
      - disciplinary_decision
      - final_childcare_plan_approval
      - final_staffing_decision
      - unilateral_manual_revision
    principle: "AIは保育上の最終判断者ではなく、観測・整理・接続・比較・問い返し・計画案生成を行う補助機構である。"

  presenter:
    id: thread_presenter
    name: スレゼンター
    role: "Shared Landscapeを職員が読むことのできるThreadとしてレンダリングする。"
    input:
      - observations
      - timestamps
      - observer_context
      - related_development_records
      - related_childcare_plans
      - safety_events
      - staffing_context
    output:
      - thread
      - relationships
      - differences
      - questions
      - candidate_next_observations
    not:
      - ai_persona
      - autonomous_decision_maker
      - staff_evaluator
      - child_evaluator
      - replacement_for_staff_meeting

  github:
    role:
      - shared_landscape_memory
      - version_history
      - evidence_trace
      - knowledge_continuity
      - protocol_versioning
    not_for:
      - staff_ranking
      - personnel_evaluation
      - surveillance
    records:
      - observations
      - development_records
      - plan_versions
      - revisions
      - reviews
      - safety_events
      - staffing_records
      - landscape_changes
      - protocol_changes
      - generated_artifacts
    rule: "GitHubは園の経験と知識を継承する共有記憶として扱い、個人監視の基盤にはしない。"

  artifact_generation:
    source: evidence
    principle: "一つのEvidenceから必要なArtifactを派生させる。"
    examples:
      - observation -> daily_log
      - observation -> childcare_plan_draft
      - hiyari_hat -> prevention_proposal
      - incident -> incident_report
      - thread -> meeting_minutes_draft
      - accumulated_evidence -> manual_revision_proposal
      - daily_landscape -> next_day_plan
    rule: "生成物はEvidenceそのものではなく、Evidenceから生成されたArtifactとして区別する。"

  feedback_loop:
    - child_landscape
    - observation
    - development
    - childcare_plan
    - environment
    - staffing
    - practice
    - checkpoint
    - hiyari_hat
    - incident
    - review
    - shared_landscape
    - ai_feedback
    - presenter_thread
    - human_dialogue
    - next_day_plan
    - human_approval
    - next_landscape

  api_endpoints:
    observations:
      create: {method: POST, path: /observations}
      list: {method: GET, path: /observations}
    children:
      landscape: {method: GET, path: /children/{child_id}/landscape}
      development: {method: GET, path: /children/{child_id}/development}
    childcare_plans:
      draft: {method: POST, path: /children/{child_id}/plans/draft}
      next_day_draft: {method: POST, path: /children/{child_id}/plans/next-day/draft}
      review: {method: POST, path: /children/{child_id}/plans/{plan_id}/review}
      approve: {method: POST, path: /children/{child_id}/plans/{plan_id}/approve}
    developmental_support:
      assess: {method: POST, path: /children/{child_id}/support/assess}
      suggest: {method: POST, path: /children/{child_id}/support/suggest}
    safety:
      checkpoint: {method: POST, path: /safety/checkpoints}
      hiyari_hat: {method: POST, path: /safety/hiyari-hat}
      incident: {method: POST, path: /safety/incidents}
    staffing:
      assess: {method: POST, path: /staffing/assess}
      simulate: {method: POST, path: /staffing/simulate}
    presenter:
      render: {method: POST, path: /presenter/render}
      thread: {method: GET, path: /presenter/threads/{thread_id}}
    documents:
      draft: {method: POST, path: /documents/draft}
      review: {method: POST, path: /documents/{document_id}/review}
      approve: {method: POST, path: /documents/{document_id}/approve}
    feedback:
      observe: {method: POST, path: /feedback/observe}
      plan: {method: POST, path: /feedback/plan}
      landscape: {method: GET, path: /feedback/landscape}

  privacy:
    requirements:
      - access_control
      - audit_log
      - data_minimization
      - purpose_limitation
      - separation_of_personnel_evaluation
      - secure_storage
      - human_review_for_sensitive_outputs
    rule: "実証環境では個人情報・要配慮情報の取り扱いを施設の規程と適用法令に従って設計する。"

  versioning:
    protocol:
      semantic_versioning: true
    plan:
      immutable_history: true
    observation:
      original_record_preserved: true
    artifact:
      generated_from_evidence: true
    rule: "過去の観察・計画・インシデント記録を後から書き換えて履歴を消失させず、修正はRevisionとして記録する。"

  facility_adaptation:
    principle: "プロトコルは共通、運用は施設ごとに適応する。"
    workspace_profile:
      inputs:
        - operating_policy
        - childcare_philosophy
        - organizational_structure
        - current_recording_method
        - staffing_structure
        - meeting_structure
        - safety_management
        - developmental_support_practice
      rule: "施設固有の運営方針をプロトコル本体へ埋め込まず、導入時にWorkspace Profileとして適応する。"

  implementation_scope:
    alpha: "3施設で、今日の観測から翌日の保育計画案までの循環を実証する。"
    success_condition:
      - "今日の観察がShared Landscapeに接続される。"
      - "複数職員の観察がスレゼンターによって対話可能なThreadとして提示される。"
      - "AIが翌日の保育計画案を生成する。"
      - "人間が確認・修正・承認する。"
      - "翌日の実践結果が新しいObservationとして循環に戻る。"
    evaluation:
      - childcare_continuity
      - observation_quality
      - planning_burden
      - documentation_burden
      - information_sharing
      - safety_learning
      - staffing_load_visibility
      - next_day_plan_adoption
