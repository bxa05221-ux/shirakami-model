name: Human Gate Boundary Test

on:
  push:
    branches:
      - audit/human-gate-promotion-boundary
  pull_request:
    branches:
      - main

jobs:
  human-gate-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Human Gate boundary tests
        run: python -m pytest runtime/test_human_gate.py -q
